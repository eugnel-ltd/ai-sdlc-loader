# The App's formal review of each open PR head, served by the public loader (ai-sdlc #731 slice 5).
#
# Reusable workflow. A repo calls it from `.github/workflows/ai-sdlc-bot-review.yml` on main, on
# schedule or workflow_dispatch, with the read permissions below and `id-token: write`.
# bot_review.sh, review_on_head.sh and head_checks.sh come from the signed gate bundle, never from
# the caller or a PR. For each open PR by an allowed author it submits APPROVE, REQUEST_CHANGES or a
# COMMENT on the PR head from the AI-SDLC merge gate; it never merges (auto_merge.sh does).
#
# Tokens: the job's own read-only github.token reads PRs, reviews, comments, checks, statuses and
# runs. Only the review POST uses a one-hour eugnel-ai-sdlc-gates App token for this repository
# (pull-requests write), which the broker issues to this caller file alone. No PAT.
name: Bot review

on:
  workflow_call:
    inputs:
      authors:
        description: Comma-separated GitHub logins whose PRs are reviewed
        type: string
        default: fol2

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read
  id-token: write

concurrency:
  group: ai-sdlc-bot-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    name: The App reviews every open PR on its head
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "small"]') }}
    timeout-minutes: 10
    steps:
      - name: Load the signed gate bundle
        id: gates
        run: |
          set -eu
          loader=$RUNNER_TEMP/ai-sdlc-loader gates=$RUNNER_TEMP/ai-sdlc-gates
          rm -rf "$loader" "$gates"
          loader_sha=$(python3 -I - <<'NAME_LOADER'
          import base64, json, os, re, sys, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=ai-sdlc-gates"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(request, timeout=10))["value"]
          part = token.split(".")[1]
          sha = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))).get("job_workflow_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("the OIDC token names no loader commit")
          print(sha)
          NAME_LOADER
          )
          git init -q "$loader"
          git -C "$loader" fetch -q --depth=1 https://github.com/eugnel-ltd/ai-sdlc-loader.git "$loader_sha"
          git -C "$loader" checkout -q --detach FETCH_HEAD
          sh "$loader/verifier/fetch_cosign.sh" "$RUNNER_TEMP/ai-sdlc-verifier"
          python3 -I "$loader/fetch_gates.py" bundle --verifier "$RUNNER_TEMP/ai-sdlc-verifier" --out "$gates"
      - name: Review as the App
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: main
          BOT_REVIEW_AUTHORS: ${{ inputs.authors }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -eu
          python3 -I "$RUNNER_TEMP/ai-sdlc-loader/fetch_gates.py" repo-token --out "$RUNNER_TEMP/app-token"
          REVIEW_TOKEN=$(cat "$RUNNER_TEMP/app-token"); rm -f "$RUNNER_TEMP/app-token"
          echo "::add-mask::$REVIEW_TOKEN"
          export REVIEW_TOKEN
          sh "$RUNNER_TEMP/ai-sdlc-gates/scripts/bot_review.sh" --repo "$GITHUB_REPOSITORY"
