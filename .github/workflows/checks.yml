# AI-SDLC checks, served by the public loader (ai-sdlc #731).
#
# Reusable workflow. A repo of eugnel-ltd or fol2 calls it from its thin caller
# `.github/workflows/ai-sdlc-checks.yml` on main, with `permissions: id-token: write`:
#   uses: eugnel-ltd/ai-sdlc-loader/.github/workflows/checks.yml@v3            (adopters, slice 6)
#   uses: eugnel-ltd/ai-sdlc-loader/.github/workflows/checks.yml@<40-hex sha>  (the canary only)
# One job per event resolves the PR, fetches and verifies the signed bundle once and checks out
# once. On PR events it runs the review gate and then the five other gates, and each publishes
# its former check-run name as a commit status. A review comment runs only the review gate,
# which keeps its legacy `ai-sdlc/review-on-head` status semantics.
# No gate reads the caller's `.ai-sdlc/` or runs PR code.
# Public repos use GitHub-hosted Ubuntu; private repos use the small self-hosted runner.
# The caller's runs_on input is accepted and ignored.
name: AI-SDLC checks

on:
  workflow_call:
    inputs:
      base:
        description: The trusted helper and policy branch (locked tests use the PR target separately)
        type: string
        default: main
      scripts_dir:
        description: Ignored; every gate runs from the signed archive (ai-sdlc #731)
        type: string
        default: .ai-sdlc
      test_paths:
        description: Pathspecs that identify test files, space-separated
        type: string
        default: "tests/ :(glob)**/test_*.py :(glob)**/*_test.go :(glob)**/*.test.* :(glob)**/*.spec.*"
      runs_on:
        description: Ignored; the loader chooses the runner from the repo's visibility
        type: string
        default: '["self-hosted", "small"]'

# id-token: fetching and unpacking the signed bundle mint Actions OIDC tokens.
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  id-token: write

# The PR's own commits are fetched as data (refs/pull/<n>/head) and never checked out as the
# working tree the scripts run from. The refspec forces the update ("+"): a self-hosted runner
# keeps refs/remotes/pr/head from the last PR it checked, and a plain fetch refuses that
# non-fast-forward update, exits 1 and, with -q, prints nothing.

# One selector shared by the gate steps; all paths are in the verified bundle.
env:
  GATE_STATUS: |
    # An EXIT trap also publishes early input failures and unexpected command exits.
    finish_gate() {
      gate_rc=$?
      trap - EXIT
      case "$gate_rc" in
        0) gate_state=success; gate_description="Gate passed" ;;
        1) gate_state=failure; gate_description="Gate failed" ;;
        *) gate_state=error; gate_description="Gate error (exit $gate_rc)" ;;
      esac
      if gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
           -f state="$gate_state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" \
           -f description="$gate_description" > /dev/null; then
        echo "status $STATUS_CONTEXT=$gate_state on $HEAD"
      else
        echo "::error::could not write the status $STATUS_CONTEXT on $HEAD"
        [ "$gate_rc" -ne 0 ] || gate_rc=2
      fi
      exit "$gate_rc"
    }
    trap finish_gate EXIT
  BUNDLE_GATE_SELECTOR: |
    # until step 8c: older signed bundles still need their original entry points.
    case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) os=unknown ;; esac
    case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) arch=unknown ;; esac
    aisdlc=$gates/bin/$os-$arch/aisdlc
    if [ ! -x "$aisdlc" ] ||
       [ "$("$aisdlc" gate 2>&1 | sed -n '1p')" != 'usage: aisdlc gate <name> [args]' ]; then
      aisdlc=
    fi
    select_gate() {
      if [ -n "$aisdlc" ]; then
        gate=( "$aisdlc" gate "$1" )
      else
        shift
        gate=( "$@" )
      fi
    }

jobs:
  checks:
    name: AI-SDLC gates
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "small"]') }}
    # Ten minutes for setup and cleanup, plus six sequential ten-minute gate limits.
    timeout-minutes: 70
    # One group per PR and event kind, never cancelled. A review-comment run queues only behind
    # other comment runs and a PR-event run only behind PR-event runs, so neither can replace a
    # pending run of the other kind and drop its statuses.
    concurrency:
      group: ai-sdlc-checks-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{ github.event_name == 'issue_comment' && 'review' || 'gates' }}
      cancel-in-progress: false
    steps:
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_ISSUE_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -eu
          command -v gh >/dev/null || { echo "::error::gh is not installed on this runner"; exit 2; }
          resolve_error() { echo "::error::$*"; exit 2; }
          full_sha() {
            case "$1" in *[!0-9a-f]*|"") return 1 ;; esac
            [ ${#1} -eq 40 ]
          }
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            requested=$PR_NUMBER
          elif [ "$EVENT" = issue_comment ] && [ "$IS_ISSUE_PR" = true ]; then
            requested=$ISSUE_NUMBER
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$requested" in ''|*[!0-9]*) resolve_error "Invalid PR number" ;; esac
          # One authenticated snapshot binds the head and actual target together. The
          # configured helper branch remains independent of these product data refs.
          snapshot=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$requested" \
            --jq '[.number,.head.sha,.head.ref,.base.sha,.base.ref,.base.repo.full_name]|@tsv') \
            || resolve_error "Could not resolve the current PR"
          case "$snapshot" in *$'\n'*|*$'\r'*) resolve_error "Invalid PR metadata row" ;; esac
          IFS=$'\t' read -r number head branch target_base_sha target_base_ref base_repo surplus <<EOF
          $snapshot
          EOF
          [ "$number" = "$requested" ] && [ -z "$surplus" ] || resolve_error "PR identity mismatch"
          full_sha "$head" && full_sha "$target_base_sha" || resolve_error "Invalid PR commit identity"
          git check-ref-format "refs/heads/$branch" >/dev/null 2>&1 \
            && git check-ref-format "refs/heads/$target_base_ref" >/dev/null 2>&1 \
            || resolve_error "Invalid PR branch identity"
          [ "$base_repo" = "$GITHUB_REPOSITORY" ] || resolve_error "PR target repository mismatch"
          if [ "$EVENT" != issue_comment ]; then
            [ "$head" = "$PR_HEAD" ] && [ "$branch" = "$PR_BRANCH" ] \
              && [ "$target_base_ref" = "$PR_BASE_REF" ] && [ "$base_repo" = "$PR_BASE_REPO" ] \
              || resolve_error "PR changed head or target since this event"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "target_base_sha=$target_base_sha" >> "$GITHUB_OUTPUT"
          echo "target_base_ref=$target_base_ref" >> "$GITHUB_OUTPUT"
          echo "is_pr=true" >> "$GITHUB_OUTPUT"
      # This job's one broker fetch uses this loader commit's fetcher and pinned verifier.
      # Every gate checks the fetch and unpack outcomes, including gates that would skip.
      - name: Fetch the signed gate bundle for this run
        id: gates
        if: steps.pr.outputs.is_pr == 'true'
        continue-on-error: true
        run: |
          set -eu
          loader=$RUNNER_TEMP/ai-sdlc-loader
          rm -rf "$loader" "$RUNNER_TEMP/ai-sdlc-fetch" "$RUNNER_TEMP/ai-sdlc-verifier" "$RUNNER_TEMP/ai-sdlc-gates"
          loader_sha=$(python3 -I - <<'NAME_LOADER'
          import base64, json, os, re, sys, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=ai-sdlc-gates"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(request, timeout=10))["value"]
          part = token.split(".")[1]
          sha = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))).get("job_workflow_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("the OIDC token names no loader commit")
          print(sha)
          NAME_LOADER
          )
          echo "loader_sha=$loader_sha" >> "$GITHUB_OUTPUT"
          git init -q "$loader"
          git -C "$loader" fetch -q --depth=1 https://github.com/eugnel-ltd/ai-sdlc-loader.git "$loader_sha"
          git -C "$loader" checkout -q --detach FETCH_HEAD
          sh "$loader/verifier/fetch_cosign.sh" "$RUNNER_TEMP/ai-sdlc-verifier"
          python3 -I "$loader/fetch_gates.py" fetch --verifier "$RUNNER_TEMP/ai-sdlc-verifier" --out "$RUNNER_TEMP/ai-sdlc-fetch"
      - name: Verify and unpack the signed gate bundle
        id: bundle
        if: steps.pr.outputs.is_pr == 'true' && steps.gates.outcome == 'success'
        env:
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
        run: |
          set -eu
          # Reuse the fetched loader and pinned verifier; no extra download or broker fetch.
          python3 -I "$RUNNER_TEMP/ai-sdlc-loader/fetch_gates.py" unpack \
            --verifier "$RUNNER_TEMP/ai-sdlc-verifier" --saved "$RUNNER_TEMP/ai-sdlc-fetch" \
            --loader-sha "$LOADER_SHA" --out "$RUNNER_TEMP/ai-sdlc-gates"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        if: always() && steps.pr.outputs.is_pr == 'true'
        with:
          fetch-depth: 0
      - name: Independent APPROVE names the head
        id: review-on-head
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ steps.pr.outputs.number }}
        # GitHub runs `bash -e`, so every failing command is wrapped in if/else: the status POST must
        # run on a failure too, or a revoked approval would leave the last success in place.
        run: |
          set -u
          # A late run on a closed or merged PR leaves the head's status alone (#596). A failed state
          # read writes the status as before.
          if pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state 2>/dev/null) \
             && [ "$pr_state" = closed ]; then
            echo "::notice::PR #$PR is closed: this ${EVENT-} run leaves ai-sdlc/review-on-head on $HEAD unchanged"
            [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] || exit 2
            exit 0
          fi
          gates=$RUNNER_TEMP/ai-sdlc-gates
          evaluate() {
            if [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ]; then
              eval "$BUNDLE_GATE_SELECTOR"
              select_gate review-on-head sh "$gates/scripts/review_on_head.sh"
              if "${gate[@]}" "$PR" "$HEAD" --repo "$GITHUB_REPOSITORY" > result.txt 2>&1; then code=0; else code=$?; fi
              cat result.txt
              line=$(head -1 result.txt | cut -c1-140)
            else
              echo "::error::the signed AI-SDLC gate bundle is unavailable: see the lines above"
              code=2; line="signed gate bundle unavailable"
            fi
            case "$code" in 0) state=success ;; 1) state=failure ;; *) state=error ;; esac
            # No review of this head yet is a wait, not a rejection (#622). Any other first line,
            # including a changed message, keeps failure.
            case "$code:$line" in "1:REVIEW-ON-HEAD FAIL: no review names "*) state=pending ;; esac
          }
          publish() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
              -f state="$state" -f context=ai-sdlc/review-on-head -f target_url="$RUN_URL" \
              -f description="$line" > /dev/null
          }
          evaluate
          # PR-event runs and review-comment runs sit in different concurrency groups, so another
          # run may write this status between our read and our write. After each write, read the
          # reviews again and rewrite until the written result still holds. The last write of any
          # run is then followed by a read that agrees with it; a later review starts a new run.
          written=""
          for attempt in 1 2 3 4 5; do
            if ! publish; then
              echo "::error::could not write the status ai-sdlc/review-on-head on $HEAD"
              [ "$code" -ne 0 ] || code=2
              exit "$code"
            fi
            echo "status ai-sdlc/review-on-head=$state on $HEAD"
            written="$state:$line"
            [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] || break
            evaluate > /dev/null
            [ "$state:$line" != "$written" ] || break
            echo "::notice::the review result changed while publishing; writing it again"
            [ "$attempt" -lt 5 ] || { echo "::error::the review result kept changing on $HEAD"; exit 2; }
          done
          # The status holds the merge, not this job (#622).
          [ "$code" -ne 1 ] || code=0
          exit "$code"
      - name: owner-decisions.md is append-only
        id: owner-decisions
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
        env:
          STATUS_CONTEXT: checks / owner-decisions.md is append-only
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          BASE: ${{ inputs.base }}
          PR: ${{ steps.pr.outputs.number }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
        run: |
          eval "$GATE_STATUS"
          [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] \
            || { echo "::error::the signed AI-SDLC gate bundle or trusted checkout is unavailable"; exit 2; }
          gates=$RUNNER_TEMP/ai-sdlc-gates
          set -u
          git fetch -q origin "$BASE" "+refs/pull/$PR/head:refs/remotes/pr/head"
          eval "$BUNDLE_GATE_SELECTOR"
          select_gate owner-decisions sh "$gates/scripts/owner_decisions_check.sh"
          "${gate[@]}" "origin/$BASE" pr/head
      - name: A fix leaves its failing test alone
        id: locked-tests
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
        env:
          STATUS_CONTEXT: checks / A fix leaves its failing test alone
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
          BASE: ${{ inputs.base }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          TARGET_BASE_SHA: ${{ steps.pr.outputs.target_base_sha }}
          TEST_PATHS: ${{ inputs.test_paths }}
        run: |
          eval "$GATE_STATUS"
          [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] \
            || { echo "::error::the signed AI-SDLC gate bundle or trusted checkout is unavailable"; exit 2; }
          gates=$RUNNER_TEMP/ai-sdlc-gates
          set -eu
          case "$BRANCH" in fix/*) ;; *) echo "not a fix/ branch: skipped"; exit 0 ;; esac
          record_error() { echo "LOCKED-TESTS RECORD ERROR: $*"; exit 2; }
          full_sha() {
            case "$1" in *[!0-9a-f]*|"") return 1 ;; esac
            [ ${#1} -eq 40 ]
          }
          full_sha "$HEAD_SHA" && full_sha "$TARGET_BASE_SHA" || record_error "invalid PR commit identity"
          git fetch -q origin "$BASE" "$TARGET_BASE_SHA" "+refs/pull/$PR/head:refs/remotes/pr/head" \
            || record_error "could not fetch trusted source and pinned PR objects"
          trusted=$(git rev-parse --verify "origin/$BASE^{commit}") || record_error "invalid trusted source"
          target=$(git rev-parse --verify "$TARGET_BASE_SHA^{commit}") || record_error "invalid target object"
          fetched_head=$(git rev-parse --verify 'pr/head^{commit}') || record_error "invalid fetched PR head"
          [ "$target" = "$TARGET_BASE_SHA" ] && [ "$fetched_head" = "$HEAD_SHA" ] \
            || record_error "fetched PR identity mismatch"
          test_paths=$TEST_PATHS
          # Only the signed bundle supplies the helper. Both modern and older interfaces compare
          # against the independently pinned PR target.
          eval "$BUNDLE_GATE_SELECTOR"
          run_locked() {
            locked_base_arg=$(git rev-parse --verify "$2^{commit}") || { echo "LOCKED-TESTS RECORD ERROR: invalid base"; return 2; }
            locked_head_arg=$(git rev-parse --verify "$3^{commit}") || { echo "LOCKED-TESTS RECORD ERROR: invalid head"; return 2; }
            select_gate locked-tests python3 "$5"
            if [ "${gate[1]}" = gate ]; then
              "${gate[@]}" --base "$locked_base_arg" --head "$locked_head_arg" --test-paths "$test_paths"
              return $?
            fi
            if [ -f "$4" ]; then
              cp "$4" "$5" || { echo "LOCKED-TESTS RECORD ERROR: helper read failed"; return 2; }
              locked_help=$(python3 "$5" --help 2>&1) || { printf '%s\n' "$locked_help"; echo "LOCKED-TESTS RECORD ERROR: helper interface failed"; return 2; }
              case "$locked_help" in
                *"--base "*) python3 "$5" --base "$locked_base_arg" --head "$locked_head_arg" --test-paths "$test_paths"; return $? ;;
              esac
              locked_legacy=$5
            else
              locked_legacy=
            fi
            python3 - "$locked_base_arg" "$locked_head_arg" "$test_paths" "$locked_legacy" <<'LOCKED_PY'
          import os, shlex, subprocess, sys

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, check=True).stdout

          try:
              base = git("rev-parse", "--verify", "--quiet", sys.argv[1] + "^{commit}").decode().strip()
              head = git("rev-parse", "--verify", "--quiet", sys.argv[2] + "^{commit}").decode().strip()
              patterns = shlex.split(sys.argv[3])
              if not patterns:
                  raise ValueError("no test pathspecs given")
              commits = git("log", "--reverse", "--format=%H", base + ".." + head, "--", *patterns).splitlines()
              if not commits:
                  print("LOCKED-TESTS NOTE: no test commit on this branch")
                  sys.exit(0)
              first = commits[0].decode()
              paths = [os.fsdecode(p) for p in git("diff-tree", "--no-commit-id", "--no-renames", "--name-only", "-r", "-z", first, "--", *patterns).split(b"\0") if p]
              if not paths:
                  raise ValueError("no locked test files given")
              for path in paths:
                  git("cat-file", "-e", first + ":" + path)
              # An older trusted helper supports the manual interface, but not --base.
              if len(sys.argv) > 4 and sys.argv[4]:
                  checked = subprocess.run([sys.executable, sys.argv[4], "--test-commit", first,
                                            "--head", head, "--tests", *("./" + path for path in paths)], capture_output=True)
                  sys.stdout.buffer.write(checked.stdout)
                  sys.stderr.buffer.write(checked.stderr)
                  if checked.returncode not in (0, 1, 2):
                      raise ValueError(f"legacy helper failed with exit {checked.returncode}")
                  if checked.returncode == 0:
                      print(f"LOCKED-TESTS NOTE: unchanged since {first[:12]}")
                  sys.exit(checked.returncode)
              changed = git("--literal-pathspecs", "diff", "--no-renames", "--name-status", first, head, "--", *paths)
              changes = [line for line in changed.decode("utf-8", "replace").splitlines() if line.strip()]
              if changes:
                  print(f"LOCKED-TESTS FAIL: {len(changes)} locked file(s) changed between {first[:12]} and {head[:12]}")
                  for line in changes:
                      print("  " + line)
                  print("A fix may not edit its locked test. Revert the test, or open a separate PR that changes the test, with its own review.")
                  sys.exit(1)
              print(f"LOCKED-TESTS OK: {len(paths)} locked file(s) unchanged between {first[:12]} and {head[:12]}")
              print(f"LOCKED-TESTS NOTE: unchanged since {first[:12]}")
          except (OSError, ValueError, subprocess.CalledProcessError) as error:
              print(f"LOCKED-TESTS RECORD ERROR: {error}")
              sys.exit(2)
          LOCKED_PY
          }
          run_locked "$trusted" "$target" "$HEAD_SHA" "$gates/scripts/locked_tests_check.py" "$RUNNER_TEMP/locked_tests_check.py"
      - name: No credentials in the PR range
        id: secret-scan
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
        env:
          STATUS_CONTEXT: checks / No credentials in the PR range
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          BASE: ${{ inputs.base }}
          PR: ${{ steps.pr.outputs.number }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          eval "$GATE_STATUS"
          [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] \
            || { echo "::error::the signed AI-SDLC gate bundle or trusted checkout is unavailable"; exit 2; }
          gates=$RUNNER_TEMP/ai-sdlc-gates
          set -u
          git fetch -q origin "$BASE" "+refs/pull/$PR/head:refs/remotes/pr/head"
          eval "$BUNDLE_GATE_SELECTOR"
          select_gate secret-scan sh "$gates/scripts/secret_scan.sh"
          "${gate[@]}" "origin/$BASE" pr/head
          # Written-by ran after a successful scan in the former secret-scan job.
          set -u
          # The shared setup unpacked and checked the signed bundle.
          gates=$RUNNER_TEMP/ai-sdlc-gates
          # The prebuilt gate binaries for this runner (#731 section 4: runners build nothing).
          case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) os=unknown ;; esac
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) arch=unknown ;; esac
          bin=$gates/bin/$os-$arch
          written_by_rc=0 written_by_output=
          base_sha=$(git --no-replace-objects rev-parse --verify "origin/$BASE^{commit}") || written_by_rc=2
          sha=$(git --no-replace-objects rev-parse --verify 'pr/head^{commit}') || written_by_rc=2
          eval "$BUNDLE_GATE_SELECTOR"
          select_gate written-by "$bin/written-by"
          [ -x "${gate[0]}" ] || written_by_rc=2
          if [ "$written_by_rc" -eq 0 ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.txt" \
              && git --no-replace-objects -c core.quotePath=false diff --no-renames --name-only "$base_sha...$sha" > "$RUNNER_TEMP/pr-files.txt" \
              || written_by_rc=2
          fi
          if [ "$written_by_rc" -eq 0 ]; then
            written_by_output=$("${gate[@]}" --body-file "$RUNNER_TEMP/pr-body.txt" --files "$RUNNER_TEMP/pr-files.txt" 2>&1) || written_by_rc=$?
            # The native exit and last-line contract (ai-sdlc scripts/written_by_native.sh).
            case "$written_by_rc:$(printf '%s\n' "$written_by_output" | tail -n 1)" in
              '0:written-by: native'|'0:written-by: vendor'|'0:written-by: design'|'0:written-by: lane-failed'|'0:written-by: claude'|'0:written-by: docs only'|'0:written-by: operational data only'|'1:written-by: unknown'|2:*) ;;
              *) written_by_rc=2 written_by_output="::error::written-by native result violates exit/output contract" ;;
            esac
          fi
          if [ "$written_by_rc" -ne 0 ] && [ -z "$written_by_output" ]; then
            written_by_output='::error::written-by trusted input or helper unavailable
          written-by: not checked (native setup failure)'
          fi
          # Owner decision (James, 24 Oct 2026): an unrecognised or missing author only warns.
          if [ "$written_by_rc" -eq 1 ]; then
            written_by_output=$(printf '%s\n' "$written_by_output" | sed 's/^::error title=Written by::/::warning title=Written by::/
          $i\
          ::warning title=Written by::Not blocking: an unrecognised or missing author line only warns (owner, 24 Oct 2026).')
            written_by_rc=0
          fi
          printf '%s\n' "$written_by_output"
          printf '%s\n' "$written_by_output" | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          exit "$written_by_rc"
      - name: product.yaml is valid and a published product has its baseline
        id: manifest
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
        env:
          STATUS_CONTEXT: checks / product.yaml is valid and a published product has its baseline
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          BASE: ${{ inputs.base }}
          PR: ${{ steps.pr.outputs.number }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
        run: |
          eval "$GATE_STATUS"
          [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] \
            || { echo "::error::the signed AI-SDLC gate bundle or trusted checkout is unavailable"; exit 2; }
          gates=$RUNNER_TEMP/ai-sdlc-gates
          set -u
          git fetch -q origin "$BASE" "+refs/pull/$PR/head:refs/remotes/pr/head"
          sha=$(git --no-replace-objects rev-parse 'pr/head^{commit}') || exit 2
          # The product file is data; it is read before any check runs.
          product=$(git --no-replace-objects ls-tree "$sha" -- product.yaml) || exit 2
          if [ -z "$product" ]; then echo "no product.yaml"; exit 0; fi
          case "$product" in '100644 blob '*|'100755 blob '*) ;; *) echo "MANIFEST ERROR: product.yaml is not a regular file"; exit 2 ;; esac
          git --no-replace-objects show "$sha:product.yaml" > "$RUNNER_TEMP/product.yaml" || exit 2
          # The prebuilt gate binaries for this runner (#731 section 4: runners build nothing).
          case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) os=unknown ;; esac
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) arch=unknown ;; esac
          bin=$gates/bin/$os-$arch
          eval "$BUNDLE_GATE_SELECTOR"
          select_gate manifest-check "$bin/manifest-check"
          [ -x "${gate[0]}" ] || { echo "MANIFEST ERROR: trusted manifest bundle unavailable"; exit 2; }
          "${gate[@]}" "$RUNNER_TEMP/product.yaml"
      - name: Cloudflare config stays inside the US$5 plan
        id: cloudflare-cost
        timeout-minutes: 10
        if: always() && steps.pr.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
        env:
          STATUS_CONTEXT: checks / Cloudflare config stays inside the US$5 plan
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_READY: ${{ steps.gates.outcome == 'success' && steps.bundle.outcome == 'success' }}
          CHECKOUT_READY: ${{ steps.checkout.outcome == 'success' }}
          BASE: ${{ inputs.base }}
          PR: ${{ steps.pr.outputs.number }}
          LOADER_SHA: ${{ steps.gates.outputs.loader_sha }}
        run: |
          eval "$GATE_STATUS"
          [ "$BUNDLE_READY" = true ] && [ "$CHECKOUT_READY" = true ] \
            || { echo "::error::the signed AI-SDLC gate bundle or trusted checkout is unavailable"; exit 2; }
          gates=$RUNNER_TEMP/ai-sdlc-gates
          set -u
          git fetch -q origin "$BASE" "+refs/pull/$PR/head:refs/remotes/pr/head"
          base_sha=$(git rev-parse --verify "origin/$BASE^{commit}") || exit 2
          sha=$(git rev-parse --verify 'pr/head^{commit}') || exit 2
          # The prebuilt gate binaries for this runner (#731 section 4: runners build nothing).
          case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) os=unknown ;; esac
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) arch=unknown ;; esac
          bin=$gates/bin/$os-$arch
          eval "$BUNDLE_GATE_SELECTOR"
          select_gate cf-cost-check "$bin/cf-cost-check"
          [ -x "${gate[0]}" ] || { echo "CF-COST: input error: trusted native bundle unavailable"; exit 2; }
          # The base's owner decisions may allow a paid feature; the PR's own copy never counts.
          set --
          if git --no-replace-objects show "$base_sha:docs/owner-decisions.md" > "$RUNNER_TEMP/owner-decisions.md" 2>/dev/null; then
            set -- --decisions "$RUNNER_TEMP/owner-decisions.md"
          fi
          rc=0; "${gate[@]}" --head "$sha" --base "$base_sha" "$@" || rc=$?
          # The one documented fix for every finding (ai-sdlc #731): measure, set limits, rate-limit per IP.
          [ "$rc" -ne 1 ] || echo "::error::How to fix: https://github.com/eugnel-ltd/ai-sdlc/blob/main/references/cloudflare.md#the-one-way-to-meet-the-limits-and-the-rate-limit"
          exit "$rc"
      - name: Clean up the gate bundle and temporary inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ai-sdlc-fetch" "$RUNNER_TEMP/ai-sdlc-gates" \
            "$RUNNER_TEMP/ai-sdlc-loader" "$RUNNER_TEMP/ai-sdlc-verifier"
          rm -f "$RUNNER_TEMP/locked_tests_check.py" "$RUNNER_TEMP/pr-body.txt" \
            "$RUNNER_TEMP/pr-files.txt" "$RUNNER_TEMP/product.yaml" "$RUNNER_TEMP/owner-decisions.md"
