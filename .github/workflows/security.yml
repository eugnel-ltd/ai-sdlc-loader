# AI-SDLC weekly security scan: secrets (gitleaks), dependencies (osv-scanner) and static analysis
# (semgrep, the free p/default rules). Each run writes one digest issue labelled security-finding,
# a checklist edited in place while it is open, at most one write per run; a finding already on
# another security-finding issue or a closed digest is not listed, so closing dismisses it
# (scripts/security_intake.py). Confirmed false positives go in the caller's .gitleaks.toml or
# .gitleaksignore, which gitleaks reads from the scanned checkout.
#
# Reusable workflow, served by the public loader (ai-sdlc #731 slice 4). A repo calls it from
# `.github/workflows/ai-sdlc-security.yml` on main, on schedule or workflow_dispatch, with
# `permissions: id-token: write`. security_intake.py comes from the signed gate bundle, which this
# loader commit's fetch_gates.py and pinned verifier check before use; the caller's `.ai-sdlc/`
# is not read. Free tools only (owner, 14 Oct 2026: no paid Actions minutes): [self-hosted, macos]
# for a private repo, GitHub-hosted only for a public one (#731 section 7). With Homebrew (the Mac
# runner) the step installs any missing gitleaks, osv-scanner and zstd; without it (GitHub-hosted
# Ubuntu) it takes pinned release binaries checked by SHA-256. semgrep goes into a throwaway venv.
# The scanners read the tree; nothing in it runs. Issues name the file, the line and the rule,
# never the matched text: gitleaks runs with --redact and the intake reads no text fields.
name: AI-SDLC weekly security

on:
  workflow_call:
    inputs:
      runs_on:
        description: Ignored; the loader chooses the runner from the repo's visibility
        type: string
        default: '["self-hosted", "macos"]'
      scripts_dir:
        description: Ignored; security_intake.py comes from the signed archive (ai-sdlc #731)
        type: string
        default: .ai-sdlc

# id-token: the broker serves the signed gate bundle only to a verified caller (#731 section 2).
permissions:
  contents: read
  issues: write
  id-token: write

# One intake at a time per repo: two runs that read the issues at once could both file a finding.
concurrency:
  group: ai-sdlc-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    name: Secrets, dependencies and static analysis
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "macos"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the scanners (free; Homebrew or pinned release binaries, and a throwaway venv)
        run: |
          set -eu
          if command -v brew >/dev/null; then
            for t in gitleaks osv-scanner zstd; do command -v "$t" >/dev/null || brew install "$t"; done
          else
            # Linux without Homebrew (GitHub-hosted, public repos): release binaries checked by SHA-256.
            case "$(uname -m)" in
              x86_64|amd64) gl=x64 osv=amd64
                gl_sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
                osv_sum=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b ;;
              aarch64|arm64) gl=arm64 osv=arm64
                gl_sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
                osv_sum=4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7 ;;
              *) echo "::error::no pinned scanner build for $(uname -m)"; exit 1 ;;
            esac
            bin=$RUNNER_TEMP/sec-bin; mkdir -p "$bin"
            curl -fsSL -o "$bin/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_$gl.tar.gz"
            echo "$gl_sum  $bin/gitleaks.tar.gz" | sha256sum -c -
            tar -xzf "$bin/gitleaks.tar.gz" -C "$bin" gitleaks
            curl -fsSL -o "$bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_$osv"
            echo "$osv_sum  $bin/osv-scanner" | sha256sum -c -
            chmod 755 "$bin/gitleaks" "$bin/osv-scanner"
            echo "$bin" >> "$GITHUB_PATH"
            PATH=$bin:$PATH
            command -v zstd >/dev/null || { echo "::error::zstd is not on this runner"; exit 1; }
          fi
          python3 -m venv "$RUNNER_TEMP/sec-venv"
          "$RUNNER_TEMP/sec-venv/bin/python" -m pip install -q semgrep==1.181.0
          gitleaks version; osv-scanner --version | head -1; "$RUNNER_TEMP/sec-venv/bin/semgrep" --version
      # One broker fetch for this run: verify the newest unexpired signed record and the archive,
      # then unpack it. Any failure stops the run; there is no fallback to another copy.
      - name: Load the signed gate bundle
        run: |
          set -eu
          loader=$RUNNER_TEMP/ai-sdlc-loader
          rm -rf "$loader" "$RUNNER_TEMP/ai-sdlc-gates"
          loader_sha=$(python3 -I - <<'NAME_LOADER'
          import base64, json, os, re, sys, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=ai-sdlc-gates"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(request, timeout=10))["value"]
          part = token.split(".")[1]
          sha = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))).get("job_workflow_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("the OIDC token names no loader commit")
          print(sha)
          NAME_LOADER
          )
          git init -q "$loader"
          git -C "$loader" fetch -q --depth=1 https://github.com/eugnel-ltd/ai-sdlc-loader.git "$loader_sha"
          git -C "$loader" checkout -q --detach FETCH_HEAD
          sh "$loader/verifier/fetch_cosign.sh" "$RUNNER_TEMP/ai-sdlc-verifier"
          python3 -I "$loader/fetch_gates.py" bundle --verifier "$RUNNER_TEMP/ai-sdlc-verifier" --out "$RUNNER_TEMP/ai-sdlc-gates"
      - name: Scan
        run: |
          set -u
          out=$RUNNER_TEMP/sec; mkdir -p "$out"
          gitleaks detect --no-git --source . --redact --report-format json --report-path "$out/gitleaks.json" --exit-code 0 || exit 1
          # osv-scanner exits 1 when it finds a vulnerability and 128 when there is no lockfile to scan.
          # The runner's shell has errexit on, so the status is captured in a conditional.
          rc=0; osv-scanner --format json -r . > "$out/osv.json" || rc=$?
          case $rc in 0|1) ;; 128) echo '{"results": []}' > "$out/osv.json" ;; *) exit 1 ;; esac
          "$RUNNER_TEMP/sec-venv/bin/semgrep" scan --config p/default --json --output "$out/semgrep.json" --metrics off --quiet . || exit 1
      - name: One digest issue per run
        env:
          GH_TOKEN: ${{ github.token }}
          # An environment variable, not a flag: an older security_intake.py ignores it.
          SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          gh label create security-finding --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Found by the weekly AI-SDLC security scan" --force
          for l in intent security; do gh label create "$l" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; done
          out=$RUNNER_TEMP/sec
          python3 -I "$RUNNER_TEMP/ai-sdlc-gates/scripts/security_intake.py" --repo "$GITHUB_REPOSITORY" --root . \
            --gitleaks "$out/gitleaks.json" --osv "$out/osv.json" --semgrep "$out/semgrep.json" --file
